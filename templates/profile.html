{% extends 'basetemplate.html' %}

{% block content %}
<div class="container-fluid py-3 mb-5" style="max-width: 800px;">
    
    <!-- Header Title -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold text-portal-dark mb-1">
                <i class="fa-solid fa-user-gear text-primary me-2"></i>จัดการโปรไฟล์
            </h4>
            <p class="text-muted small mb-0">อัปเดตข้อมูลส่วนตัวและรูปโปรไฟล์ของคุณ</p>
        </div>
    </div>

    <!-- Profile Form Card -->
    <div class="card border-0 shadow-sm" style="border-radius: 1rem;">
        <div class="card-body p-4">
            <!-- เพิ่ม enctype="multipart/form-data" เพื่อให้อัปโหลดไฟล์รูปภาพได้ -->
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <!-- แสดงรูปโปรไฟล์ปัจจุบัน (ถ้ามี) -->
                <div class="text-center mb-4">
                    {% if user.profile.image %}
                        <img src="{{ user.profile.image.url }}" alt="Profile Image" class="rounded-circle shadow-sm mb-2" style="width: 100px; height: 100px; object-fit: cover;">
                    {% else %}
                        <div class="rounded-circle bg-light d-inline-flex align-items-center justify-content-center shadow-sm mb-2 text-secondary fs-3" style="width: 100px; height: 100px;">
                            <i class="fa-solid fa-user"></i>
                        </div>
                    {% endif %}
                    <div class="small text-muted">รูปโปรไฟล์ปัจจุบัน</div>
                </div>

                <!-- แสดง Form ฟิลด์ต่างๆ จาก Django Form -->
                {{ form.as_p }}

                <!-- เพิ่มฟิลด์อัปโหลดรูปภาพ (หากฟอร์มใน forms.py ยังไม่มีช่องอัปโหลดรูปโดยตรง) -->
                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">เปลี่ยนรูปโปรไฟล์</label>
                    <input type="file" class="form-control border border-secondary-subtle shadow-sm" name="profile_image" accept="image/*" style="border-radius: 0.5rem;">
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm py-2" style="border-radius: 0.5rem;">
                    <i class="fa-solid fa-floppy-disk me-1"></i> บันทึกการเปลี่ยนแปลง
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
