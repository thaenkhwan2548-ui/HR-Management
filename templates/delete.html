{% extends 'basetemplate.html' %}

{% block content %}
<div class="container py-5" style="max-width: 600px;">
    <div class="card border-0 shadow-sm" style="border-radius: 1rem;">
        <div class="card-body p-4 text-center">
            
            <div class="mb-3 text-warning fs-1">
                <i class="fa-solid fa-user-slash"></i>
            </div>

            <h4 class="fw-bold mb-2">ยืนยันการบันทึกสถานะลาออก</h4>
            
            <p class="text-muted mb-4">
                คุณต้องการบันทึกสถานะให้พนักงาน <span class="fw-semibold text-dark">{{ object.first_name }} {{ object.last_name }}</span> ลาออกใช่หรือไม่?
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'index' %}" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 0.5rem;">
                        ยกเลิก
                    </a>
                    <button type="submit" class="btn btn-warning px-4 py-2 text-white fw-semibold" style="border-radius: 0.5rem; background-color: #f59e0b;">
                        ยืนยันการลาออก
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
